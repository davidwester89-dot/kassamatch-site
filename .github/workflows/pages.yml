# Bouwt KassaMatch en publiceert via GitHub Pages (bron: GitHub Actions).
# PREVIEW (nu): BASE=/kassamatch-site → https://davidwester89-dot.github.io/kassamatch-site/ (noindex, robots Disallow, geen CNAME).
# LIVEGANG (pas na akkoord Dave): BASE leeg en GO_LIVE=1 (schrijft CNAME kassamatch.nl); custom domain kassamatch.nl
# eerst weghalen bij de placeholder-repo 'kassamatch' en daarna op deze repo zetten. DNS staat al op GitHub Pages.
name: Deploy KassaMatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BASE: ''
  GO_LIVE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
